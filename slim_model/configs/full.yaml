# Baseline architecture, trained for the same short budget as the slim variants.
# training and model configuration (keys match the authors model.yaml; the extra keys are read by train_slim.py)
batch_size: 8 # per-GPU batch size; 8 x 4 GPUs = 32 global, the paper's global batch (4 per GPU on 8 GPUs)
learning_rate: 1.e-4
selected_channels: # 0 - u_1, 1 - u_2, 2 - sigma_vM, 3 - sigma_22 (Lagrangian frame)
- 0
- 1
- 3
train_timesteps: 256
sampling_timesteps: 100 # only used for the preview samples during training; eval_slim.py sets its own
use_dynamic_thres: true
reference_frame: lagrangian
padding_mode: zeros
unet_attn_dim_head: 32
unet_attn_heads: 8
unet_resnet_groups: 8
unet_cond_attention: self-stacked
unet_cond_to_time: add
unet_temporal_att_cond: true
unet_use_sparse_linear_attn: true
per_frame_cond: true
unet_cond_att_GRU: false
unet_cond_attention_tokens: 16
image_size: 96
num_frames: 11
# short-budget ablation (paper trained 200k steps); every variant uses the same budget
train_num_steps: 30000
save_and_sample_every: 5000
null_cond_prob: 0.1
ema_decay: 0.995
unet_dim: 64
unet_dim_mults: [1, 2, 4, 8]
