# Tiny config for a CPU or 1-GPU smoke test on fake data. Not a real model.
# training and model configuration (keys match the authors model.yaml; the extra keys are read by train_slim.py)
batch_size: 2
learning_rate: 1.e-4
selected_channels: # 0 - u_1, 1 - u_2, 2 - sigma_vM, 3 - sigma_22 (Lagrangian frame)
- 0
- 1
- 3
train_timesteps: 256
sampling_timesteps: 4
use_dynamic_thres: true
reference_frame: lagrangian
padding_mode: zeros
unet_attn_dim_head: 8
unet_attn_heads: 2
unet_resnet_groups: 4
unet_cond_attention: self-stacked
unet_cond_to_time: add
unet_temporal_att_cond: true
unet_use_sparse_linear_attn: true
per_frame_cond: true
unet_cond_att_GRU: false
unet_cond_attention_tokens: 16
image_size: 96
num_frames: 11
# short-budget ablation (paper trained 200k steps); every variant uses the same budget
train_num_steps: 4
save_and_sample_every: 2
null_cond_prob: 0.1
ema_decay: 0.995
unet_dim: 8
unet_dim_mults: [1, 2]
